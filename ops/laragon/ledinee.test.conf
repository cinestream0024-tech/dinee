<VirtualHost *:80>
    ServerName ledinee.test
    DocumentRoot "D:/laragon/www/dinee/frontend/dist"
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api/ http://127.0.0.1:8000/api/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass /sanctum/ http://127.0.0.1:8000/sanctum/ retry=0
    ProxyPassReverse /sanctum/ http://127.0.0.1:8000/sanctum/

    <Directory "D:/laragon/www/dinee/frontend/dist">
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
